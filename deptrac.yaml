parameters:
    paths:
        - ./PhpcrMigration

    layers:
        - name: UserInterface
          collectors:
              - type: directory
                value: UserInterface/.*
        - name: Infrastructure
          collectors:
              - type: directory
                value: Infrastructure/.*
        - name: Application
          collectors:
              - type: directory
                value: Application/.*
        - name: Domain
          collectors:
              - type: directory
                value: Domain/.*

    ruleset:
        UserInterface:
            - Application
            - Domain
        Infrastructure:
            - Application
            - Domain
        Application:
            - Domain
        Domain: ~
